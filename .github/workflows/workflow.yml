name: CI & Release

on:
  push:
    branches: [ main , develop ]
    paths-ignore:
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: 检查版本并决定是否需要发布 (仅 main 分支)
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      module_version: ${{ steps.check.outputs.module_version }}
      tag_name: ${{ steps.check.outputs.tag_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and check version
        id: check
        run: |
          # 从 MODULE.bazel 提取版本号
          MODULE_VERSION=$(grep -E '^\s*version\s*=' MODULE.bazel | head -1 | sed 's/.*version\s*=\s*"\([^"]*\)".*/\1/')
          echo "module_version=$MODULE_VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$MODULE_VERSION" >> $GITHUB_OUTPUT

          echo "Detected MODULE.bazel version: $MODULE_VERSION"

          # 检查 tag 是否已存在
          if git tag | grep -q "^v${MODULE_VERSION}$"; then
            echo "Tag v${MODULE_VERSION} already exists locally"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            # 检查远程 tag
            git fetch --tags origin
            if git tag | grep -q "^v${MODULE_VERSION}$"; then
              echo "Tag v${MODULE_VERSION} already exists remotely"
              echo "should_release=false" >> $GITHUB_OUTPUT
            else
              echo "Tag v${MODULE_VERSION} does not exist, will create release"
              echo "should_release=true" >> $GITHUB_OUTPUT
            fi
          fi

  # Job 2: 基础 Linux 检查 (Host 环境)
  host-linux-check:
    name: Check Host (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./examples
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-version: 1.x
          repository-cache: true
          disk-cache: ${{ github.workflow }}-linux

      - name: Run hello_world (Linux)
        run: bazel run --config=linux :hello_world

      - name: Run fmtlib tests (Linux)
        run: bazel run --config=linux --test_output=errors third-party/fmtlib:test_fmt

  # Job 3: 交叉编译 (依赖 host-linux-check)
  cross-compile:
    name: Build ${{ matrix.platform }}
    needs: host-linux-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./examples
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-aarch64
            config: linux-aarch64
          - platform: linux-luckfox
            config: linux-luckfox
          - platform: linux-riscv64
            config: linux-riscv64
          - platform: linux-loongarch64
            config: linux-loongarch64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-version: 1.x
          repository-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.platform }}

      - name: Build and Check ${{ matrix.platform }}
        run: |
          TARGETS=":hello_world third-party/fmtlib:test_fmt"
          
          for TARGET in $TARGETS; do
            echo "----------------------------------------"
            echo "Building $TARGET for ${{ matrix.platform }}..."
          
            bazel build --config=${{ matrix.config }} --keep_going $TARGET
          
            BIN_PATH=$(bazel cquery --config=${{ matrix.config }} --output=files $TARGET | head -n 1)
          
            echo "===================>"
            echo "Checking binary type for: $BIN_PATH"
            file "$BIN_PATH"
            echo "<==================="
          done

  # Job 4: 源码打包发布 (依赖所有编译检查完成和版本检查，仅 main 分支)
  release:
    name: Create Release
    needs: [cross-compile, check-version]
    runs-on: ubuntu-latest
    if: needs.cross-compile.result == 'success' && needs.check-version.outputs.should_release == 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup release info
        id: release_info
        run: |
          MODULE_VERSION="${{ needs.check-version.outputs.module_version }}"
          TAG_NAME="${{ needs.check-version.outputs.tag_name }}"
          REPO_NAME="${{ github.event.repository.name }}"

          # main 分支发布，develop 分支不会触发 release
          IS_PRERELEASE="false"
          RELEASE_NAME="Release ${MODULE_VERSION}"
          ARCHIVE_NAME="${REPO_NAME}-${MODULE_VERSION}"

          echo "module_version=$MODULE_VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "archive_name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT

          echo "=== Release Info ==="
          echo "Version: $MODULE_VERSION"
          echo "Tag: $TAG_NAME"
          echo "Archive: $ARCHIVE_NAME"
          echo "Pre-release: $IS_PRERELEASE"

      - name: Create and push tag
        run: |
          TAG_NAME="${{ steps.release_info.outputs.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Release ${{ steps.release_info.outputs.module_version }}"
          git push origin "$TAG_NAME"
          echo "Tag $TAG_NAME created and pushed successfully"

      - name: Create source archive (exclude examples and .github)
        id: archive
        run: |
          ARCHIVE_NAME="${{ steps.release_info.outputs.archive_name }}"
          MODULE_VERSION="${{ steps.release_info.outputs.module_version }}"
          REPO_NAME="${{ steps.release_info.outputs.repo_name }}"

          # 创建临时目录
          mkdir -p dist

          # 使用 tar 打包，排除不需要的文件
          tar --exclude='examples' \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='*.lock' \
              --exclude='dist' \
              --transform "s,^,${ARCHIVE_NAME}/," \
              -czvf "dist/${ARCHIVE_NAME}.tar.gz" \
              .

          # 同时创建 zip 格式
          mkdir -p "dist/${ARCHIVE_NAME}"
          rsync -av --progress . "dist/${ARCHIVE_NAME}/" \
              --exclude examples \
              --exclude .git \
              --exclude .github \
              --exclude '*.lock' \
              --exclude dist

          cd dist
          zip -r "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"
          rm -rf "${ARCHIVE_NAME}"
          cd ..

          echo "Created archives:"
          ls -lh dist/

          # 验证打包内容中的版本号
          echo ""
          echo "Verifying MODULE.bazel in archive:"
          tar -xzf "dist/${ARCHIVE_NAME}.tar.gz" -O "${ARCHIVE_NAME}/MODULE.bazel" | head -5

      - name: Calculate integrity hash
        id: integrity
        run: |
          ARCHIVE_NAME="${{ steps.release_info.outputs.archive_name }}"

          # 计算 tar.gz 的 SHA256 并转换为 SRI 格式 (sha256-base64)
          TAR_GZ_HASH=$(sha256sum "dist/${ARCHIVE_NAME}.tar.gz" | cut -d' ' -f1)
          TAR_GZ_INTEGRITY="sha256-$(echo -n "$TAR_GZ_HASH" | xxd -r -p | base64 -w0)"

          # 计算 zip 的 SHA256 并转换为 SRI 格式
          ZIP_HASH=$(sha256sum "dist/${ARCHIVE_NAME}.zip" | cut -d' ' -f1)
          ZIP_INTEGRITY="sha256-$(echo -n "$ZIP_HASH" | xxd -r -p | base64 -w0)"

          echo "tar_gz_integrity=$TAR_GZ_INTEGRITY" >> $GITHUB_OUTPUT
          echo "zip_integrity=$ZIP_INTEGRITY" >> $GITHUB_OUTPUT
          echo "tar_gz_sha256=$TAR_GZ_HASH" >> $GITHUB_OUTPUT
          echo "zip_sha256=$ZIP_HASH" >> $GITHUB_OUTPUT

          echo ""
          echo "=== Integrity Hashes ==="
          echo "tar.gz: $TAR_GZ_INTEGRITY"
          echo "zip:    $ZIP_INTEGRITY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          prerelease: ${{ steps.release_info.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
          body: |
            ## 📦 ${{ steps.release_info.outputs.release_name }}

            ### 构建信息
            | 属性 | 值 |
            |------|-----|
            | **版本** | `${{ steps.release_info.outputs.module_version }}` |
            | **分支** | `${{ github.ref_name }}` |
            | **提交** | `${{ github.sha }}` |
            | **构建时间** | ${{ github.event.head_commit.timestamp }} |

            ### 支持的平台
            - ✅ linux-x86_64 (Host)
            - ✅ linux-aarch64
            - ✅ linux-luckfox (armv7l)
            - ✅ linux-riscv64
            - ✅ linux-loongarch64

            ### 文件校验
            | 文件 | SHA256 | Integrity (SRI) |
            |------|--------|-----------------|
            | `${{ steps.release_info.outputs.archive_name }}.tar.gz` | `${{ steps.integrity.outputs.tar_gz_sha256 }}` | `${{ steps.integrity.outputs.tar_gz_integrity }}` |
            | `${{ steps.release_info.outputs.archive_name }}.zip` | `${{ steps.integrity.outputs.zip_sha256 }}` | `${{ steps.integrity.outputs.zip_integrity }}` |

            ### 使用方法

            **MODULE.bazel (Bzlmod 推荐)**
            ```starlark
            bazel_dep(name = "cc_toolchains_linux", version = "${{ steps.release_info.outputs.module_version }}")
            archive_override(
                module_name = "cc_toolchains_linux",
                integrity = "${{ steps.integrity.outputs.tar_gz_integrity }}",
                strip_prefix = "${{ steps.release_info.outputs.archive_name }}",
                urls = ["https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag_name }}/${{ steps.release_info.outputs.archive_name }}.tar.gz"],
            )
            ```

            **WORKSPACE (传统方式)**
            ```starlark
            load("@bazel_tools//tools/build_defs/repo:http.bzl", "http_archive")

            http_archive(
                name = "cc_toolchains_linux",
                integrity = "${{ steps.integrity.outputs.tar_gz_integrity }}",
                strip_prefix = "${{ steps.release_info.outputs.archive_name }}",
                urls = ["https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag_name }}/${{ steps.release_info.outputs.archive_name }}.tar.gz"],
            )
            ```

            > ⚠️ 源码包已排除 `examples` 和 `.github` 目录
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "## 🎉 Release Created Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Release Info" >> $GITHUB_STEP_SUMMARY
          echo "| 属性 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ steps.release_info.outputs.tag_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.release_info.outputs.module_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-release | ${{ steps.release_info.outputs.is_prerelease }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Archive | \`${{ steps.release_info.outputs.archive_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔐 Integrity" >> $GITHUB_STEP_SUMMARY
          echo "| 文件 | Integrity |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| tar.gz | \`${{ steps.integrity.outputs.tar_gz_integrity }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| zip | \`${{ steps.integrity.outputs.zip_integrity }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Quick Copy" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`starlark" >> $GITHUB_STEP_SUMMARY
          echo "bazel_dep(name = \"cc_toolchains_linux\", version = \"${{ steps.release_info.outputs.module_version }}\")" >> $GITHUB_STEP_SUMMARY
          echo "archive_override(" >> $GITHUB_STEP_SUMMARY
          echo "    module_name = \"cc_toolchains_linux\"," >> $GITHUB_STEP_SUMMARY
          echo "    integrity = \"${{ steps.integrity.outputs.tar_gz_integrity }}\"," >> $GITHUB_STEP_SUMMARY
          echo "    strip_prefix = \"${{ steps.release_info.outputs.archive_name }}\"," >> $GITHUB_STEP_SUMMARY
          echo "    urls = [\"https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag_name }}/${{ steps.release_info.outputs.archive_name }}.tar.gz\"]," >> $GITHUB_STEP_SUMMARY
          echo ")" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Files" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -lh dist/ >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY